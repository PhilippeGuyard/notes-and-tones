name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # publish only the site itself: no docs/, tools/, README or essay template
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html 404.html styles.css robots.txt sitemap.xml feed.xml _site/
          cp -R assets essays _site/
          rm _site/essays/template.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
